{% extends "base.html" %}

{% block title %}Вход в админку - Temryuk News{% endblock %}

{% block content %}
<div class="min-h-[60vh] flex items-center justify-center">
    <div class="max-w-md w-full">
        <div class="bg-white dark:bg-gray-800 rounded-lg shadow-sm border border-gray-200 dark:border-gray-700 p-8">
            <div class="text-center mb-8">
                <h1 class="text-2xl font-bold text-gray-900 dark:text-white mb-2">🔐 Вход в админку</h1>
                <p class="text-gray-600 dark:text-gray-400">Введите пароль для доступа к панели управления</p>
            </div>

            {% if error %}
                <div class="mb-6 p-4 bg-red-50 dark:bg-red-900/20 border border-red-200 dark:border-red-800 rounded-lg">
                    <p class="text-red-600 dark:text-red-400 text-sm">{{ error }}</p>
                </div>
            {% endif %}

            <form action="/login" method="post" class="space-y-6">
                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 dark:text-gray-300 mb-2">
                        Пароль
                    </label>
                    <input 
                        type="password" 
                        id="password" 
                        name="password" 
                        required
                        class="w-full px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-lg focus:ring-2 focus:ring-primary focus:border-transparent dark:bg-gray-700 dark:text-white"
                        placeholder="Введите пароль"
                    >
                </div>

                <button 
                    type="submit" 
                    class="w-full bg-primary hover:bg-secondary text-white font-medium py-2 px-4 rounded-lg transition-colors"
                >
                    Войти
                </button>
            </form>

            <div class="mt-6 text-center">
                <a href="/" class="text-primary hover:underline text-sm">← Вернуться на главную</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
